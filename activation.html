<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <title>
    Tally Bridge Setup
  </title>

  <style>

    body {

      margin: 0;

      font-family:
        Arial,
        sans-serif;

      background:
        #f5f5f5;

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      height:
        100vh;

    }


    .container {

      background:
        white;

      padding:
        35px;

      border-radius:
        12px;

      width:
        330px;

      text-align:
        center;

      box-shadow:
        0 5px 20px
        rgba(
          0,
          0,
          0,
          0.15
        );

    }


    h1 {

      margin-top:
        0;

      font-size:
        24px;

    }


    p {

      color:
        #666;

      font-size:
        14px;

    }


    input {

      width:
        100%;

      box-sizing:
        border-box;

      padding:
        12px;

      font-size:
        16px;

      margin-top:
        20px;

      text-transform:
        uppercase;

    }


    button {

      width:
        100%;

      padding:
        12px;

      margin-top:
        15px;

      font-size:
        16px;

      cursor:
        pointer;

    }


    #message {

      margin-top:
        15px;

      font-size:
        14px;

    }

  </style>

</head>


<body>


  <div class="container">


    <h1>
      Tally Bridge Setup
    </h1>


    <p>
      Enter the activation code
      provided to you.
    </p>


    <input

      id="activationCode"

      type="text"

      placeholder="Activation Code"

      autocomplete="off"

    />


    <button
      id="activateButton"
    >

      Activate Tally Bridge

    </button>


    <div
      id="message"
    ></div>


  </div>


  <script
    src="activation.js"
  ></script>


</body>

</html>
